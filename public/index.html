<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web to ZIP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --border: #2a2a30;
      --accent: #7f5af0;
      --accent-dim: #7f5af020;
      --green: #2cb67d;
      --red: #ff4d6d;
      --text: #ffffffe6;
      --muted: #94a1b2;
      --mono: 'Space Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 3px 10px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    h1 span {
      color: var(--accent);
    }

    .sub {
      color: var(--muted);
      margin-top: 10px;
      font-size: 15px;
      max-width: 420px;
      margin-inline: auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 580px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus { border-color: var(--accent); }

    button#startBtn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    button#startBtn:hover { opacity: 0.85; }
    button#startBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Progress area */
    #progress-area {
      margin-top: 20px;
      display: none;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      margin-bottom: 8px;
    }

    .bar-track {
      background: var(--bg);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .log {
      margin-top: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      max-height: 180px;
      overflow-y: auto;
      line-height: 1.7;
    }

    .log .entry { display: flex; gap: 8px; }
    .log .entry .tag { color: var(--accent); min-width: 44px; }
    .log .entry.err .tag { color: var(--red); }
    .log .entry.ok .tag { color: var(--green); }

    /* Download button */
    #downloadBtn {
      display: none;
      width: 100%;
      margin-top: 16px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      text-align: center;
    }

    #downloadBtn:hover { opacity: 0.85; }

    .stat-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .stat {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: var(--mono);
    }

    .stat .label { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }
    .stat .value { font-size: 18px; font-weight: 700; margin-top: 2px; }

    footer {
      margin-top: 48px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">HEADLESS BROWSER POWERED</div>
    <h1>Web <span>→</span> ZIP</h1>
    <p class="sub">Ambil semua file dari website — HTML, CSS, JS, gambar — dikemas jadi satu file ZIP.</p>
  </header>

  <div class="card">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off" spellcheck="false" />
      <button id="startBtn">Download</button>
    </div>

    <div id="progress-area">
      <div class="progress-header">
        <span id="statusText">Initializing...</span>
        <span id="countText">0 / 0</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
      </div>

      <div class="log" id="logBox"></div>

      <div class="stat-row" id="statRow" style="display:none">
        <div class="stat">
          <div class="label">FILES</div>
          <div class="value" id="statFiles">—</div>
        </div>
        <div class="stat">
          <div class="label">ZIP SIZE</div>
          <div class="value" id="statSize">—</div>
        </div>
      </div>

      <button id="downloadBtn">⬇ Download ZIP</button>
    </div>
  </div>

  <footer>web-to-zip • puppeteer • railway</footer>

<script>
  const urlInput = document.getElementById("urlInput");
  const startBtn = document.getElementById("startBtn");
  const progressArea = document.getElementById("progress-area");
  const statusText = document.getElementById("statusText");
  const countText = document.getElementById("countText");
  const barFill = document.getElementById("barFill");
  const logBox = document.getElementById("logBox");
  const downloadBtn = document.getElementById("downloadBtn");
  const statRow = document.getElementById("statRow");
  const statFiles = document.getElementById("statFiles");
  const statSize = document.getElementById("statSize");

  let zipB64 = null;
  let fileCount = 0;

  function addLog(tag, text, cls = "") {
    const div = document.createElement("div");
    div.className = "entry " + cls;
    div.innerHTML = `<span class="tag">[${tag}]</span><span>${text}</span>`;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  function truncUrl(u) {
    try {
      const obj = new URL(u);
      const p = obj.pathname;
      return obj.hostname + (p.length > 28 ? "..." + p.slice(-20) : p);
    } catch { return u.slice(0, 40); }
  }

  startBtn.addEventListener("click", async () => {
    const url = urlInput.value.trim();
    if (!url) return;

    // Reset
    zipB64 = null;
    fileCount = 0;
    logBox.innerHTML = "";
    barFill.style.width = "0%";
    statRow.style.display = "none";
    downloadBtn.style.display = "none";
    progressArea.style.display = "block";
    startBtn.disabled = true;
    statusText.textContent = "Connecting...";
    countText.textContent = "0 / ?";

    const evtSource = new EventSource(`/api/scrape?url=${encodeURIComponent(url)}`);

    evtSource.onmessage = (e) => {
      const data = JSON.parse(e.data);

      if (data.type === "start") {
        addLog("SYS", data.message);
      }

      if (data.type === "page") {
        fileCount++;
        const pct = data.total ? Math.round((data.processed / data.total) * 100) : 5;
        barFill.style.width = pct + "%";
        statusText.textContent = "Crawling pages...";
        countText.textContent = `${data.processed} / ${data.total}`;
        addLog("PAGE", truncUrl(data.url));
      }

      if (data.type === "asset") {
        fileCount++;
        const pct = data.total ? Math.round((data.processed / data.total) * 100) : 50;
        barFill.style.width = pct + "%";
        statusText.textContent = "Downloading assets...";
        countText.textContent = `${data.processed} / ${data.total}`;
        addLog("ASSET", truncUrl(data.url));
      }

      if (data.type === "done") {
        barFill.style.width = "100%";
        statusText.textContent = "Done!";
        countText.textContent = `${fileCount} files`;
        zipB64 = data.zip;
        addLog("DONE", `ZIP ready — ${formatSize(data.size)}`, "ok");
        statFiles.textContent = fileCount;
        statSize.textContent = formatSize(data.size);
        statRow.style.display = "flex";
        downloadBtn.style.display = "block";
        startBtn.disabled = false;
        evtSource.close();
      }

      if (data.type === "error") {
        addLog("ERR", data.message, "err");
        statusText.textContent = "Failed";
        startBtn.disabled = false;
        evtSource.close();
      }
    };

    evtSource.onerror = () => {
      addLog("ERR", "Connection lost", "err");
      startBtn.disabled = false;
      evtSource.close();
    };
  });

  downloadBtn.addEventListener("click", () => {
    if (!zipB64) return;
    const blob = new Blob([Uint8Array.from(atob(zipB64), c => c.charCodeAt(0))], { type: "application/zip" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    try {
      const domain = new URL(urlInput.value.trim()).hostname.replace("www.", "");
      a.download = domain + ".zip";
    } catch { a.download = "website.zip"; }
    a.click();
  });

  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") startBtn.click();
  });
</script>
</body>
</html>
